name: Run pytest

on:
  pull_request:

concurrency:
  group: pytest-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
          cache-dependency-glob: "src/python/requirements-dev.txt"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r src/python/requirements-dev.txt

      - name: Run tests
        run: uv run pytest tests/python/ -v
